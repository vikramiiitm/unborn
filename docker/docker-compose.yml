version: "3.9"

# Unborn – Phase 1
# Management Plane. Redroid bodies are started on the host by the Orchestrator.

services:
  postgres:
    image: postgres:16-alpine
    container_name: unborn-postgres
    environment:
      POSTGRES_USER: unborn
      POSTGRES_PASSWORD: unborn
      POSTGRES_DB: unborn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unborn"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: unborn-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  orchestrator:
    build:
      context: ../management/orchestrator
      dockerfile: Dockerfile
    container_name: unborn-orchestrator
    environment:
      DATABASE_URL: postgres://unborn:unborn@postgres:5432/unborn?sslmode=disable
      REDIS_URL: redis://redis:6379
      UNBORN_ENV: development
      MAX_INSTANCES: "10"
      BEHAVIOR_LOOP: "true"
      BEHAVIOR_INTERVAL_SEC: "60"
      # Redroid ADB is published on the host; reach it from this container:
      ADB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - unborn_redroid_data:/var/lib/unborn/redroid-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  unborn_redroid_data:
